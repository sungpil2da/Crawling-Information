<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀 세션 진행판 · 2026 앵커 Summer AI 해커톤</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1015;--ink2:#242b35;--mute:#6b7480;--faint:#98a0ac;
  --rule:#dcdfe4;--rule2:#edeff2;--bg:#f4f4f2;--card:#fff;
  --sig:#d94f16;--sig-bg:#fdf0e9;--ok:#0d6e5c;--ok-bg:#e7f3ef;
  --warn:#b8860b;--warn-bg:#fbf3e0;--deep:#131b26;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.6;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;padding-bottom:70px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);
  border:1px solid var(--rule);border-radius:4px;padding:9px 11px;width:100%;background:#fff;}
textarea{resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sig);outline-offset:-1px;border-color:transparent;}
.mono{font-family:var(--mono);}

/* ===== 헤더 ===== */
header{background:var(--deep);color:#eef1f5;position:sticky;top:0;z-index:60;}
.htop{display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;}
.brand{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;display:flex;align-items:center;gap:8px;}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--sig);}
.brand small{font-family:var(--sans);font-weight:400;font-size:11.5px;color:#8b9bb0;letter-spacing:0;}
.clock{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.cbox{text-align:right;}
.cbox .lb{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:#7d8fa5;text-transform:uppercase;}
.cbox .vl{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.cbox .vl.hot{color:#ff9d6b;}
.cbox .vl.done{color:#ff6b4a;}
.tctl{display:flex;gap:5px;align-items:center;}
.tbtn{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:6px 9px;border-radius:3px;
  background:#242f3d;color:#9fb0c4;letter-spacing:.04em;}
.tbtn:hover{background:#31404f;color:#fff;}
.tbtn.go{background:var(--sig);color:#fff;}

.phases{display:flex;gap:3px;padding:0 20px 11px;overflow-x:auto;}
.pt{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:8px 13px;
  border-radius:3px;background:#212c39;color:#7d8fa5;white-space:nowrap;display:flex;align-items:center;gap:7px;}
.pt:hover{background:#2c3947;}
.pt.on{background:var(--sig);color:#fff;}
.pt.done{background:#17453b;color:#79cfba;}
.pt .ck{font-size:11px;}

/* ===== 레이아웃 ===== */
.wrap{max-width:1180px;margin:0 auto;padding:20px;}
.phead{margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--ink);}
.phead .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--sig);font-weight:700;text-transform:uppercase;}
.phead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:5px;}
.phead .sub{font-size:14px;color:var(--mute);margin-top:5px;}

.say{background:var(--deep);color:#e6ecf3;border-radius:5px;padding:14px 18px;margin-bottom:18px;font-size:15px;line-height:1.65;}
.say .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:#ffbe72;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:700;}
.say b{color:#ffd08a;}

.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:12px;}
.card.warn{border-left:3px solid var(--warn);background:var(--warn-bg);}
.card.ok{border-left:3px solid var(--ok);background:var(--ok-bg);}
.card.sig{border-left:3px solid var(--sig);background:var(--sig-bg);}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.ch h3{font-size:15px;font-weight:800;letter-spacing:-.02em;}
.ch .badge{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:3px;background:var(--rule2);color:var(--mute);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr;}}

.fl{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:5px;letter-spacing:.01em;}
.fld{margin-bottom:11px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;
  border-radius:4px;font-size:13.5px;font-weight:700;background:var(--ink);color:#fff;transition:opacity .15s;}
.btn:hover{opacity:.87;} .btn:disabled{opacity:.32;cursor:not-allowed;}
.btn.sig{background:var(--sig);} .btn.okb{background:var(--ok);}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink2);}
.btn.ghost:hover{background:var(--rule2);opacity:1;}
.btn.sm{padding:7px 11px;font-size:12px;} .btn.full{width:100%;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

/* 멤버 */
.mem{border:1px solid var(--rule);border-radius:6px;padding:14px;background:var(--card);}
.mem .nm{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.mem .nm input{font-weight:700;font-size:15px;}
.mem .del{color:var(--faint);font-size:18px;padding:0 4px;flex:0 0 auto;}
.mem .del:hover{color:var(--sig);}

/* 칩 */
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:5px 9px;
  border-radius:12px;border:1px solid var(--rule);background:#fff;color:var(--mute);white-space:nowrap;}
.chip:hover{border-color:var(--ink2);color:var(--ink2);}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.chip.r.on{background:#2160ad;border-color:#2160ad;}
.chip.p.on{background:var(--ok);border-color:var(--ok);}
.chip.n.on{background:var(--sig);border-color:var(--sig);}

/* 아이디어 */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px;margin-top:14px;}
.idea{border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:12px 13px;position:relative;}
.idea .tx{font-size:14.5px;font-weight:600;line-height:1.5;letter-spacing:-.015em;padding-right:18px;}
.idea .tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
.idea .tg span{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:10px;}
.idea .tg .r{background:#e6efff;color:#1c4f8f;} .idea .tg .p{background:var(--ok-bg);color:var(--ok);}
.idea .tg .n{background:var(--sig-bg);color:var(--sig);}
.idea .x{position:absolute;top:8px;right:9px;color:var(--faint);font-size:15px;line-height:1;}
.idea .x:hover{color:var(--sig);}
.idea.dead{opacity:.42;}
.idea.pass{border-left:3px solid var(--ok);}

.counter{font-family:var(--mono);font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
.counter b{color:var(--ink);}

/* 관문 */
.gate{border:1px solid var(--rule);border-radius:6px;background:var(--card);margin-bottom:10px;overflow:hidden;}
.gate .gt{padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--rule2);}
.gate .gt .tx{flex:1;font-size:14.5px;font-weight:600;line-height:1.5;}
.gate .gt .sc{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 9px;border-radius:3px;
  background:var(--rule2);color:var(--mute);white-space:nowrap;flex:0 0 auto;}
.gate .gt .sc.pass{background:var(--ok);color:#fff;} .gate .gt .sc.fail{background:var(--sig);color:#fff;}
.gate .gb{padding:12px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:760px){.gate .gb{grid-template-columns:1fr 1fr;}}
.gcell .gl{font-size:11px;font-weight:700;color:var(--mute);margin-bottom:5px;display:block;line-height:1.35;}
.gcell .gl em{font-style:normal;color:var(--faint);font-weight:400;display:block;font-size:10.5px;margin-top:2px;}
.tog{display:flex;gap:3px;}
.tog button{flex:1;font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 0;
  border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--faint);}
.tog button.on.o{background:var(--ok);border-color:var(--ok);color:#fff;}
.tog button.on.x{background:var(--sig);border-color:var(--sig);color:#fff;}
.gate .why{padding:0 14px 12px;}
.gate .why textarea{font-size:13px;}
.nudge{font-size:11.5px;color:var(--sig);font-weight:700;margin-top:5px;}

/* 역할 */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.role{border:1px solid var(--rule);border-radius:5px;padding:11px 12px;background:var(--card);}
.role .rn{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--sig);margin-bottom:7px;}
.role select{font-size:13.5px;padding:7px 9px;}
.role.empty{border-color:var(--sig);background:var(--sig-bg);}

/* 문장 */
.sentence{background:var(--deep);color:#eef2f7;border-radius:6px;padding:20px 22px;font-size:19px;
  line-height:1.75;font-weight:500;letter-spacing:-.02em;margin-top:14px;}
.sentence .ph{color:#6d8299;font-style:italic;}
.sentence b{color:#ffc06b;}

/* 체크 */
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule2);cursor:pointer;}
.chk:last-child{border-bottom:none;}
.chk .bx{width:19px;height:19px;border:2px solid var(--rule);border-radius:3px;flex:0 0 auto;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;}
.chk.on .bx{background:var(--ok);border-color:var(--ok);}
.chk .lb{font-size:14px;line-height:1.5;}
.chk.on .lb{color:var(--mute);text-decoration:line-through;}

.scope{margin-bottom:10px;}
.scope .sl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;
  border-radius:3px;display:inline-block;margin-bottom:6px;}
.s-must{background:var(--sig);color:#fff;} .s-should{background:var(--warn);color:#fff;}
.s-could{background:#8b95a3;color:#fff;} .s-wont{background:var(--rule);color:var(--mute);}

.steps8{counter-reset:d;}
.step8{display:flex;gap:10px;align-items:center;margin-bottom:7px;}
.step8::before{counter-increment:d;content:counter(d);font-family:var(--mono);font-size:11px;
  font-weight:700;color:var(--sig);flex:0 0 20px;}

/* 하단바 */
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);
  padding:11px 20px;display:flex;gap:10px;align-items:center;z-index:55;flex-wrap:wrap;}
.bottom .st{font-family:var(--mono);font-size:11px;color:var(--mute);}
.bottom .sp{flex:1;}

.hide{display:none!important;}
.out{font-family:var(--mono);font-size:11.5px;line-height:1.7;background:#0f151c;color:#cfd9e4;
  padding:16px;border-radius:5px;white-space:pre-wrap;max-height:340px;overflow-y:auto;margin-top:12px;}
.tiny{font-size:11.5px;color:var(--mute);line-height:1.55;margin-top:5px;}
</style>
</head>
<body>

<header>
  <div class="htop">
    <div class="brand"><span class="dot"></span>SESSION BOARD<small>2026 앵커 Summer AI 해커톤 · 팀빌딩</small></div>
    <div class="clock">
      <div class="tctl">
        <button class="tbtn" data-min="7">7분</button>
        <button class="tbtn" data-min="10">10분</button>
        <button class="tbtn" data-min="15">15분</button>
        <button class="tbtn" data-min="20">20분</button>
        <button class="tbtn" data-min="25">25분</button>
        <button class="tbtn go" id="tStop">정지</button>
      </div>
      <div class="cbox"><span class="lb">구간</span><span class="vl" id="segClock">--:--</span></div>
      <div class="cbox"><span class="lb">18:00까지</span><span class="vl" id="sesClock">--:--</span></div>
    </div>
  </div>
  <div class="phases" id="phases"></div>
</header>

<div class="wrap" id="body"></div>

<div class="bottom">
  <span class="st" id="statLine">—</span>
  <span class="sp"></span>
  <button class="btn ghost sm" id="btnLoad">불러오기</button>
  <button class="btn ghost sm" id="btnSave">파일로 저장</button>
  <button class="btn sig sm" id="btnMd">슬랙용 정리 뽑기</button>
  <input type="file" id="fileIn" accept=".json" class="hide">
</div>

<script>
"use strict";

const ROLES=['엣지 · 비전','백엔드','프론트','LLM · 리포트','기획 · 발표'];
const REGIONS=['구미·경북','대전·충청','수원·경기','부산·경남','광주·전남','대구','울산','내 고향','기타'];
const PROCESS=['표면처리','용접','금형','열처리','주조','소성가공','조립','물류·창고','안전관리','기타'];
const NATURE=['감각 의존','사각지대','기록 부재','경보 피로','언어 장벽','간헐 발생'];
const GATES=[
  {k:'demo', t:'① 데모', q:'발표장 책상 위에서 7분 안에 보여줄 수 있나?', no:'실제 설비·차량·센서가 필요하면 탈락'},
  {k:'data', t:'② 데이터', q:'오늘 밤 안에 입력 데이터를 만들 수 있나?', no:'공개 데이터셋 다운로드가 답이면 위험'},
  {k:'why',  t:'③ 왜 아직?', q:'왜 지금까지 아무도 안 했나?', no:'"아무도 생각 못 했다"는 거짓말'},
  {k:'payer',t:'④ 지불자', q:'누가 돈을 내나?', no:'"중소기업이 낸다"면 탈락'},
];
const PHASES=[
  {t:'0 자원',  h:'자원 인벤토리',   sub:'아이디어보다 먼저. 못 만드는 걸 정하지 않기 위해.', min:10},
  {t:'1 발산',  h:'문제 발산',       sub:'솔루션이 아니라 문제를 모은다. 20개는 나와야 정상.', min:25},
  {t:'2 관문',  h:'관문 통과',       sub:'사랑에 빠지기 전에 죽인다. 3개 이상 O만 생존.', min:20},
  {t:'3 결정',  h:'결정과 역할',     sub:'5명이 동시에 손을 움직일 수 있는가.', min:20},
  {t:'4 착수',  h:'착수 체크리스트', sub:'21:00에 첫 커밋이 가능한 상태로.', min:120},
];

const S={
  phase:0,
  members:[0,1,2,3,4].map(()=>({name:'',can:'',cant:'',region:'',access:'',gear:''})),
  ideas:[],
  draft:{text:'',region:'',process:'',nature:''},
  chosen:null,
  roles:{},
  sent:{who:'',problem:'',how:'',demo:''},
  demo8:['','','','','','','',''],
  scope:{must:'',should:'',could:'',wont:''},
  checks:{},
  timer:{end:0,label:''},
  sessionEnd:null,
};
const CHECKS=[
  '데모 시나리오 8단계를 문장으로 다 적었다',
  '역할 5개가 모두 배정됐고 각자 첫 작업을 안다',
  'WONT 목록을 적었고 팀이 동의했다',
  'GitHub 레포를 만들고 5명 모두 push 가능하다',
  'Kiro steering 파일(tech.md)을 올렸다',
  '실물 정상 샘플 20개 이상을 확보했다',
  '흠집 낸 불량 샘플 3개 이상을 만들었다',
  'USB 웹캠 또는 대체 촬영 수단을 확인했다',
  '확정 한 문장을 팀 채널에 올렸다',
];

const $=id=>document.getElementById(id);
const esc=t=>String(t||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let uid=1;

/* ---------- 타이머 ---------- */
function startTimer(min,label){S.timer={end:Date.now()+min*60000,label:label||''};}
function tick(){
  const t=$('segClock');
  if(S.timer.end){
    const r=Math.round((S.timer.end-Date.now())/1000);
    if(r<=0){t.textContent='00:00';t.className='vl done';}
    else{t.textContent=`${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;
         t.className='vl'+(r<=60?' hot':'');}
  }else{t.textContent='--:--';t.className='vl';}
  const s=$('sesClock');
  if(!S.sessionEnd){const d=new Date();d.setHours(18,0,0,0);S.sessionEnd=d.getTime();}
  const rs=Math.round((S.sessionEnd-Date.now())/60000);
  s.textContent=rs<=0?'종료':`${Math.floor(rs/60)}h ${rs%60}m`;
  s.className='vl'+(rs<=20?' done':(rs<=45?' hot':''));
}
setInterval(tick,500);
document.querySelectorAll('.tbtn[data-min]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.min));
$('tStop').onclick=()=>{S.timer={end:0,label:''};};

/* ---------- 진행률 ---------- */
const doneOf=i=>[
  ()=>S.members.filter(m=>m.name.trim()).length>=2,
  ()=>S.ideas.length>=5,
  ()=>S.ideas.some(x=>score(x)>=3),
  ()=>!!S.chosen&&ROLES.every(r=>S.roles[r]),
  ()=>CHECKS.filter(c=>S.checks[c]).length>=6,
][i]();
const score=x=>GATES.filter(g=>x.gates[g.k]==='o').length;
const passed=x=>score(x)>=3;

function renderPhases(){
  $('phases').innerHTML=PHASES.map((p,i)=>
    `<button class="pt ${i===S.phase?'on':(doneOf(i)?'done':'')}" data-p="${i}">
      ${doneOf(i)&&i!==S.phase?'<span class="ck">✓</span>':''}${p.t}</button>`).join('');
  document.querySelectorAll('.pt').forEach(b=>b.onclick=()=>{S.phase=+b.dataset.p;render();});
}
function head(){
  const p=PHASES[S.phase];
  return `<div class="phead"><span class="kick">Phase ${S.phase} · 권장 ${p.min}분</span>
    <h1>${p.h}</h1><div class="sub">${p.sub}</div></div>`;
}
function stat(){
  const n=S.ideas.length,ps=S.ideas.filter(passed).length;
  $('statLine').textContent=`멤버 ${S.members.filter(m=>m.name.trim()).length} · 아이디어 ${n} · 생존 ${ps} · 체크 ${CHECKS.filter(c=>S.checks[c]).length}/${CHECKS.length}`;
}

/* ---------- 렌더 ---------- */
function render(){renderPhases();$('body').innerHTML=head()+[p0,p1,p2,p3,p4][S.phase]();bind();stat();}

/* Phase 0 */
function p0(){
  const hasAccess=S.members.some(m=>m.access.trim());
  return `
  <div class="say"><span class="lb">진행자 대사</span>
    "아이디어 얘기는 아직 안 합니다. 먼저 우리가 <b>뭘 할 수 있는지</b>부터 확인할게요.
    한 사람당 1분씩, 돌아가면서 채웁니다."</div>

/* Phase 1 */

/* Phase 2 */
function p2(){
  if(!S.ideas.length)return `<div class="card warn">아직 문제가 없습니다. Phase 1로 돌아가세요.</div>`;
  const sorted=[...S.ideas].sort((a,b)=>score(b)-score(a));
  return `
  <div class="say"><span class="lb">진행자 대사</span>
    "이제 하나씩 <b>죽입니다.</b> 관문 네 개 중 <b>3개 이상 O</b>만 살아남아요.<br>
    특히 ③번을 밀어붙이세요. <b>왜 지금까지 아무도 안 했는지</b> 답이 안 나오면
    그건 이미 해결됐거나, 문제가 아니거나, 우리가 모르는 이유로 불가능한 겁니다."</div>
  <div class="card sig"><b>①번이 진짜 관문입니다.</b> 팀은 늘 "센서로 고장 예측"을 하고 싶어하는데,
    센서가 없으면 데모가 없고 데모가 없으면 발표가 없습니다.</div>
  ${sorted.map(x=>{const s=score(x),p=passed(x);
    return `<div class="gate">
      <div class="gt"><div class="tx">${esc(x.text)}</div>
        <span class="sc ${p?'pass':(s<=1?'fail':'')}">${s}/4 ${p?'생존':(s<=1?'탈락':'보류')}</span></div>
      <div class="gb">${GATES.map(g=>`
        <div class="gcell"><label class="gl">${g.t} <em>${g.q}</em></label>
          <div class="tog">
            <button class="o ${x.gates[g.k]==='o'?'on':''}" data-g="${x.id}|${g.k}|o">O</button>
            <button class="x ${x.gates[g.k]==='x'?'on':''}" data-g="${x.id}|${g.k}|x">X</button>
          </div></div>`).join('')}</div>
      <div class="why"><label class="fl">③ 왜 지금까지 안 됐나 — 여기 답이 없으면 O를 줄 수 없습니다</label>
        <textarea data-why="${x.id}" rows="2" placeholder="예: 불량 데이터가 없어서 학습이 안 됐다 / 검사기를 운영할 사람이 공장에 없다">${esc(x.whyNote)}</textarea>
        ${x.gates.why==='o'&&!x.whyNote.trim()?`<div class="nudge">O를 줬는데 이유가 비어 있습니다. 발표 Q&A에서 이걸 그대로 물어봅니다.</div>`:''}
      </div></div>`;}).join('')}`;
}

/* ---------- 바인딩 ---------- */
function bind(){
  document.querySelectorAll('[data-m]').forEach(el=>el.oninput=e=>{
    S.members[+el.dataset.m][el.dataset.f]=e.target.value;stat();});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(S.members.length>1){S.members.splice(+b.dataset.del,1);render();}});
  const am=$('addMem');if(am)am.onclick=()=>{S.members.push({name:'',can:'',cant:'',region:'',access:'',gear:''});render();};

  const dt=$('dText');
  if(dt){dt.oninput=e=>{S.draft.text=e.target.value;};
    dt.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')addIdea();};dt.focus();}
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.set;S.draft[f]=S.draft[f]===b.dataset.v?'':b.dataset.v;render();
    const t=$('dText');if(t){t.focus();t.selectionStart=t.value.length;}});
  const ai=$('addIdea');if(ai)ai.onclick=addIdea;
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    S.ideas=S.ideas.filter(x=>x.id!=b.dataset.rm);if(S.chosen==b.dataset.rm)S.chosen=null;render();});

  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const [id,k,v]=b.dataset.g.split('|');
    const x=S.ideas.find(i=>i.id==id);
    x.gates[k]=x.gates[k]===v?'':v;render();});
  document.querySelectorAll('[data-why]').forEach(t=>t.oninput=e=>{
    S.ideas.find(i=>i.id==t.dataset.why).whyNote=e.target.value;});

  document.querySelectorAll('[data-pick]').forEach(l=>l.onclick=()=>{
    S.chosen=S.chosen==l.dataset.pick?null:l.dataset.pick;render();});
  document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=e=>{
    S.roles[sel.dataset.role]=e.target.value;render();});
  document.querySelectorAll('[data-s]').forEach(el=>el.oninput=e=>{
    S.sent[el.dataset.s]=e.target.value;
    const box=document.querySelector('.sentence');
    if(box)box.innerHTML=`<b>${esc(S.sent.who)||'<span class="ph">[누구]</span>'}</b>의
      ${esc(S.sent.problem)||'<span class="ph">[어떤 문제]</span>'}를
      <b>${esc(S.sent.how)||'<span class="ph">[어떻게]</span>'}</b> 푼다.<br>
      데모에서는 ${esc(S.sent.demo)||'<span class="ph">[무엇]</span>'}을 보여준다.`;});

  document.querySelectorAll('[data-d8]').forEach(el=>el.oninput=e=>{S.demo8[+el.dataset.d8]=e.target.value;});
  document.querySelectorAll('[data-sc]').forEach(el=>el.oninput=e=>{S.scope[el.dataset.sc]=e.target.value;});
  document.querySelectorAll('[data-ck]').forEach(l=>l.onclick=()=>{
    const c=l.dataset.ck;S.checks[c]=!S.checks[c];render();});
}
function addIdea(){
  const t=S.draft.text.trim();if(!t)return;
  S.ideas.push({id:String(uid++),text:t,region:S.draft.region,process:S.draft.process,
    nature:S.draft.nature,gates:{demo:'',data:'',why:'',payer:''},whyNote:''});
  S.draft.text='';render();
}

/* ---------- 저장 / 내보내기 ---------- */
function dl(name,text,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('btnSave').onclick=()=>dl('session_board.json',JSON.stringify({...S,uid},null,1),'application/json');
$('btnLoad').onclick=()=>$('fileIn').click();
$('fileIn').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());Object.assign(S,j);uid=j.uid||S.ideas.length+1;render();}
  catch(err){alert('불러오기 실패: '+err.message);}
  e.target.value='';
};
$('btnMd').onclick=()=>{
  const ch=S.ideas.find(x=>x.id==S.chosen);
  const dead=S.ideas.filter(x=>!passed(x));
  const md=`# 팀 아이디어 확정

## 한 문장
${S.sent.who||'[누구]'}의 ${S.sent.problem||'[어떤 문제]'}를 ${S.sent.how||'[어떻게]'} 푼다.
데모에서는 ${S.sent.demo||'[무엇]'}을 보여준다.

## 선택한 문제
${ch?ch.text:'(미선택)'}${ch?`
- 태그: ${[ch.region,ch.process,ch.nature].filter(Boolean).join(' / ')||'없음'}
- 관문: ${score(ch)}/4
- 왜 지금까지 안 됐나: ${ch.whyNote||'(미작성)'}`:''}

## 역할
