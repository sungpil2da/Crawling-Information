<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12181A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>SCARA JOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#12181A; --case:#1C2427; --case-2:#263135; --case-3:#313F44; --edge:#3C4C52;
  --bone:#E8E3D6; --dim:#96A2A6; --amber:#F2A83B; --cyan:#5FD3D6; --rose:#E2564A;
  --disp:'Chakra Petch',system-ui,sans-serif;
  --body:'IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--void);color:var(--bone);font-family:var(--body);
  display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;
  gap:8px;padding:calc(var(--sat) + 8px) 10px calc(var(--sab) + 8px);
  height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;
}
.lbl{font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 상태바 ---------- */
.status{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:hidden}
.brand{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.05em;flex:none}
.brand span{color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:2px;
  background:var(--case-2);border:1px solid var(--edge);flex:none;
  font-family:var(--disp);font-weight:600;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.lamp{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.pill.on{color:var(--cyan);border-color:#2F5A5C}
.pill.on .lamp{background:var(--cyan);box-shadow:0 0 7px var(--cyan)}
.pill.off{color:var(--rose);border-color:#5A2E2A}
.pill.off .lamp{background:var(--rose);box-shadow:0 0 7px var(--rose)}
.pill.wait{color:var(--amber);border-color:#5C4520}
.pill.wait .lamp{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.status .sp{flex:1}
.seqt{font-family:var(--mono);font-size:9.5px;color:#5D6C71;flex:none}

/* ---------- 경고 ---------- */
.banner{display:none;gap:8px;align-items:center;padding:8px 10px;font-size:12.5px;
  background:#2A1A18;border:1px solid #5A2E2A;border-left:3px solid var(--rose);border-radius:3px}
.banner.show{display:flex}
.banner b{font-family:var(--disp);color:var(--rose);flex:none}

/* ---------- 텔레메트리 ---------- */
.tele{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jt{background:var(--case);border:1px solid var(--edge);border-radius:3px;padding:8px 10px}
.jt-hd{display:flex;justify-content:space-between;align-items:baseline}
.jt-v{font-family:var(--mono);font-weight:600;font-size:clamp(24px,7.5vw,32px);line-height:1.05;color:var(--cyan)}
.jt-v.stale{color:var(--dim)}
.jt-u{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:2px}
.jt-c{font-family:var(--mono);font-size:9.5px;color:#5D6C71;margin-top:2px}
/* 리밋 바 : 중앙 0 기준, 마커가 현재 각도 */
.bar{position:relative;height:5px;margin-top:7px;background:var(--case-3);border-radius:3px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;width:2px;background:var(--bone);opacity:.35;left:50%}
.bar b{position:absolute;top:-1px;bottom:-1px;width:7px;border-radius:2px;background:var(--amber);
  left:50%;transform:translateX(-50%);transition:left .22s ease-out,background .15s}
.bar b.lim{background:var(--rose)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--case);border:1px solid var(--edge);border-radius:3px;padding:7px 10px;
  display:flex;justify-content:space-between;align-items:baseline}
.mini-v{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--cyan)}

/* ---------- 설정 ---------- */
.cfg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:10px 0;background:var(--case-2);border:none;border-right:1px solid var(--edge);
  color:var(--dim);font-family:var(--mono);font-weight:500;font-size:13px;touch-action:manipulation}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1A1206;font-weight:600}
.rpmbox{background:var(--case-2);border:1px solid var(--edge);border-radius:3px;padding:5px 9px;text-align:center}
.rpmbox input{width:70px;display:block;accent-color:var(--amber);margin-top:1px}

/* ---------- 컨트롤 데크 ---------- */
.deck{
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;
  gap:10px;align-content:center;justify-content:center;align-items:center;
  background:var(--case);border:1px solid var(--edge);border-radius:4px;
  padding:12px 10px;min-height:0;touch-action:none;
}
.deck .sh{grid-row:1;display:flex;justify-content:center}
.deck .sh.l{grid-column:1}
.deck .sh.r{grid-column:3}
.deck .dpad{grid-column:1;grid-row:2}
.deck .faces{grid-column:3;grid-row:2}
.deck .center{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;min-width:0}

/* 공통 키 */
.k{
  background:linear-gradient(#2E3A3F,#242E32);border:1px solid #4E6268;border-bottom:3px solid #161D20;
  color:var(--bone);border-radius:6px;display:grid;place-items:center;line-height:1.1;text-align:center;
  font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.05em;
  touch-action:none;transition:background .05s,border-color .05s,transform .05s;
}
.k:active,.k.lit{background:var(--amber);color:#1A1206;border-color:#FFD489;
  border-bottom-width:1px;transform:translateY(2px)}
.k[aria-disabled="true"]{opacity:.32;background:linear-gradient(#232B2E,#1E2528)}
.k:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* D패드 3x3 */
.dpad{display:grid;grid-template-columns:repeat(3,var(--kd));grid-template-rows:repeat(3,var(--kd));gap:4px;
  --kd:clamp(52px,17vw,68px)}
.dpad .k{font-size:10.5px}
.dpad .up{grid-area:1/2}.dpad .lf{grid-area:2/1}.dpad .rt{grid-area:2/3}.dpad .dn{grid-area:3/2}
.dpad .hub{grid-area:2/2;background:var(--case-2);border:1px solid var(--case-3);border-radius:5px;
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--amber)}
.dpad .hub small{display:block;font-size:8px;color:#5D6C71;letter-spacing:.08em}

/* 페이스 2x2 */
.faces{display:grid;grid-template-columns:repeat(2,var(--kf));grid-template-rows:repeat(2,var(--kf));gap:9px;
  --kf:clamp(50px,15.5vw,62px)}
.faces .k{border-radius:50%;font-size:9.5px}

/* 숄더 */
.sh .k{width:clamp(78px,25vw,104px);height:36px;border-radius:5px;font-size:10.5px}

/* 중앙 : 스텝 안내 */
.center .lbl{text-align:center}
.hint{font-family:var(--mono);font-size:9.5px;color:#5D6C71;text-align:center;line-height:1.5}

/* 로그 (중앙, 최근 3줄) */
.mlog{width:100%;font-family:var(--mono);font-size:9.5px;line-height:1.6;color:var(--dim);
  max-height:74px;overflow:hidden;text-align:center}
.mlog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlog .ok{color:var(--cyan)}.mlog .warn{color:var(--amber)}.mlog .err{color:var(--rose)}

/* ---------- E-STOP ---------- */
.stop{
  width:100%;padding:15px;background:#3A1512;border:1px solid var(--rose);
  border-bottom:4px solid #8F2A20;border-radius:4px;color:#FFD9D4;
  font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.2em;
  touch-action:manipulation;
}
.stop:active{background:#4E1B17;transform:translateY(2px);border-bottom-width:2px}

/* ---------- 가로 모드 ---------- */
@media(orientation:landscape) and (max-height:560px){
  body{grid-template-rows:auto auto minmax(0,1fr) auto;padding-top:calc(var(--sat) + 6px)}
  .tele{grid-template-columns:repeat(2,1fr)}
  .jt-v{font-size:clamp(20px,4.5vh,26px)}
  .cfg{display:none}
  .deck{padding:8px}
  .dpad{--kd:clamp(44px,11vh,58px)}
  .faces{--kf:clamp(42px,10.5vh,54px)}
  .mlog{max-height:46px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<!-- ================= 상태 ================= -->
<div class="status">
  <div class="brand">SCARA <span>JOG</span></div>
  <div class="pill off" id="pLink"><i class="lamp"></i><span id="pLinkT">대기</span></div>
  <div class="pill" id="pBusy"><i class="lamp"></i><span id="pBusyT">준비</span></div>
  <div class="sp"></div>
  <div class="seqt" id="pSeq">0/0</div>
</div>

<div class="banner" id="banner"><b>주의</b><span id="bannerT"></span></div>

<!-- ================= 텔레메트리 ================= -->
<div class="tele">
  <div class="jt">
    <div class="jt-hd"><span class="lbl">J1 어깨</span><span class="lbl" id="j1lim"></span></div>
    <div><span class="jt-v stale" id="j1v">—</span><span class="jt-u">deg</span></div>
    <div class="jt-c" id="j1c">— counts</div>
    <div class="bar"><i></i><b id="j1bar"></b></div>
  </div>
  <div class="jt">
    <div class="jt-hd"><span class="lbl">J2 팔꿈치</span><span class="lbl" id="j2lim"></span></div>
    <div><span class="jt-v stale" id="j2v">—</span><span class="jt-u">deg</span></div>
    <div class="jt-c" id="j2c">— counts</div>
    <div class="bar"><i></i><b id="j2bar"></b></div>
  </div>
</div>

<div class="row2">
  <div class="mini"><span class="lbl">Z축</span><span class="mini-v" id="zv">—</span></div>
  <div class="mini"><span class="lbl">그리퍼</span><span class="mini-v" id="gv">—</span></div>
</div>

<!-- ================= 설정 ================= -->
<div class="cfg">
  <div class="seg" id="segStep" role="group" aria-label="스텝 크기">
    <button data-step="1" aria-pressed="false">1°</button>
    <button data-step="5" aria-pressed="true">5°</button>
    <button data-step="15" aria-pressed="false">15°</button>
  </div>
  <div class="rpmbox">
    <span class="lbl"><span class="num" id="rpmv" style="color:var(--amber)">20</span> RPM</span>
    <input type="range" id="rpm" min="5" max="60" step="5" value="20" aria-label="조그 속도">
  </div>
</div>

<!-- ================= 컨트롤 데크 ================= -->
<div class="deck">
  <div class="sh l"><button class="k" data-act="Z+">Z ▲</button></div>
  <div class="sh r"><button class="k" data-act="HOME">HOME</button></div>

  <div class="dpad">
    <button class="k up" data-act="J2+" data-hold="1">J2 ▲</button>
    <button class="k lf" data-act="J1+" data-hold="1">◀ J1</button>
    <div class="hub" id="hub">5°<small>STEP</small></div>
    <button class="k rt" data-act="J1-" data-hold="1">J1 ▶</button>
    <button class="k dn" data-act="J2-" data-hold="1">J2 ▼</button>
  </div>

  <div class="center">
    <div class="lbl">동작 기록</div>
    <div class="mlog" id="mlog"></div>
    <div class="hint" id="hint">꾹 누르면 연속 이동</div>
    <button class="k" data-act="Z-" style="width:100%;height:34px;font-size:10.5px">Z ▼</button>
  </div>

  <div class="faces">
    <button class="k" data-act="ZERO">ZERO</button>
    <button class="k" data-act="ZHOME">Z ⌂</button>
    <button class="k" data-act="GRIP">GRIP</button>
    <button class="k" data-act="STEP">STEP</button>
  </div>
</div>

<button class="stop" id="estop">비상 정지</button>

<script type="module">
/* =====================================================================
   1) FIREBASE — 여기만 채우세요. 비우면 시뮬레이터 모드로 동작합니다.
   ===================================================================== */
const FB_CONFIG = {
  // apiKey:      "...",
  // authDomain:  "your-project.firebaseapp.com",
  // databaseURL: "https://your-project-default-rtdb.firebaseio.com",
  // projectId:   "your-project",
};
const ROBOT_ID = "scara01";

/* 2) 소프트 리밋 — ESP32 쪽과 반드시 같은 값으로 */
const LIMIT = { j1:[-120,120], j2:[-140,140], z:[0,400] };

/* 3) 연속 이동 설정 */
const HOLD_DELAY  = 400;   // 이 시간 이상 누르면 반복 시작 [ms]
const HOLD_TICK   = 100;   // 반복 가능 여부 확인 주기 [ms]

const CNT_PER_DEG = 25000/90;

/* ===================== 상태 ===================== */
const S = { step:5, rpm:20, zstep:5, seq:0, ack:0, busy:false,
            j1:null,j2:null,j1c:null,j2c:null,z:null,grip:null,
            hb:0, online:false, sim:false, refCmd:null, setFn:null };

const $ = id => document.getElementById(id);
const el = {};
['pLink','pLinkT','pBusy','pBusyT','pSeq','banner','bannerT','j1v','j1c','j1bar','j1lim',
 'j2v','j2c','j2bar','j2lim','zv','gv','mlog','hub','rpmv','hint'].forEach(k=>el[k]=$(k));
el.j1lim.textContent = `${LIMIT.j1[0]}~${LIMIT.j1[1]}°`;
el.j2lim.textContent = `${LIMIT.j2[0]}~${LIMIT.j2[1]}°`;

/* ===================== 진동 ===================== */
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ===================== 로그 (최근 4줄) ===================== */
function log(msg, kind=''){
  const d = document.createElement('div');
  d.className = kind; d.textContent = msg;
  el.mlog.prepend(d);
  while(el.mlog.children.length > 4) el.mlog.lastChild.remove();
}

/* ===================== 화면 ===================== */
function waiting(){ return S.busy || S.ack < S.seq; }
function canSend(){ return (S.sim || S.online) && !waiting(); }

function render(){
  const fresh = S.sim || (Date.now() - S.hb < 4000);
  S.online = fresh;

  el.pLink.className = 'pill ' + (S.sim ? 'wait' : fresh ? 'on' : 'off');
  el.pLinkT.textContent = S.sim ? '시뮬' : fresh ? '연결' : '응답없음';

  const w = waiting();
  el.pBusy.className = 'pill ' + (w ? 'wait' : 'on');
  el.pBusyT.textContent = w ? '동작중' : '준비';
  el.pSeq.textContent = `${S.ack}/${S.seq}`;

  if(!fresh && !S.sim){
    el.banner.classList.add('show');
    el.bannerT.textContent = '컨트롤러 응답 없음. 명령이 로봇에 도달하지 않습니다.';
  } else el.banner.classList.remove('show');

  const put=(k,lim)=>{
    const v=S[k], vE=el[k+'v'], cE=el[k+'c'], bE=el[k+'bar'];
    if(v===null||v===undefined){ vE.textContent='—'; vE.classList.add('stale'); cE.textContent='— counts'; return; }
    vE.textContent=v.toFixed(1); vE.classList.remove('stale');
    cE.textContent=`${S[k+'c'] ?? '—'} counts`;
    const f=Math.min(1,Math.max(0,(v-lim[0])/(lim[1]-lim[0])));
    bE.style.left=(f*100).toFixed(1)+'%';
    bE.classList.toggle('lim', v<=lim[0]+.5 || v>=lim[1]-.5);
  };
  put('j1',LIMIT.j1); put('j2',LIMIT.j2);

  el.zv.textContent = S.z===null?'—':S.z+' mm';
  el.gv.textContent = S.grip===null?'—':(S.grip==='open'?'열림':'닫힘');
  el.gv.style.color = S.grip==='closed' ? 'var(--amber)' : 'var(--cyan)';
  el.hub.innerHTML = S.step+'°<small>STEP</small>';

  const lock = !canSend();
  document.querySelectorAll('.k[data-act]').forEach(b=>{
    if(b.dataset.act==='STEP') return;
    b.setAttribute('aria-disabled', lock?'true':'false');
  });
}

/* ===================== 전송 ===================== */
async function send(cmd, force=false){
  if(!force && !canSend()){
    log(waiting() ? '이전 동작 진행 중' : '컨트롤러 응답 없음', 'warn');
    buzz([10,50,10]); return;
  }
  S.seq++;
  const p = { seq:S.seq, rpm:S.rpm, ts:Date.now(), ...cmd };
  if(S.sim) simExec(p);
  else{
    try{ await S.setFn(S.refCmd, p); }
    catch(e){ S.seq--; log('전송 실패 '+e.message,'err'); buzz([10,50,10]); render(); return; }
  }
  log(desc(p),'ok'); render();
}
function desc(p){
  const s=v=>(v>0?'+':'')+v;
  switch(p.action){
    case 'jog':  return `J${p.axis} ${s(p.delta)}°  seq${p.seq}`;
    case 'zjog': return `Z ${s(p.delta)}mm  seq${p.seq}`;
    case 'grip': return `그리퍼 ${p.value==='open'?'열기':'닫기'}  seq${p.seq}`;
    case 'home': return `팔 원점  seq${p.seq}`;
    case 'zhome':return `Z 원점  seq${p.seq}`;
    case 'zero': return `0° 복귀  seq${p.seq}`;
    case 'estop':return `비상 정지  seq${p.seq}`;
  }
  return p.action;
}

/* ===================== 동작 ===================== */
function clampJog(axis, d){
  const k='j'+axis, lim=LIMIT[k], cur=S[k]??0;
  const next=Math.min(lim[1],Math.max(lim[0],cur+d));
  const dd=+(next-cur).toFixed(2);
  if(Math.abs(dd)<0.05){ log(`J${axis} 리밋 도달`,'warn'); buzz([10,50,10]); return null; }
  return dd;
}
const ACT = {
  'J1+':()=>{const d=clampJog(1,+S.step); if(d) send({action:'jog',axis:1,delta:d});},
  'J1-':()=>{const d=clampJog(1,-S.step); if(d) send({action:'jog',axis:1,delta:d});},
  'J2+':()=>{const d=clampJog(2,+S.step); if(d) send({action:'jog',axis:2,delta:d});},
  'J2-':()=>{const d=clampJog(2,-S.step); if(d) send({action:'jog',axis:2,delta:d});},
  'Z+' :()=>send({action:'zjog',delta:+S.zstep}),
  'Z-' :()=>send({action:'zjog',delta:-S.zstep}),
  'GRIP':()=>send({action:'grip',value:S.grip==='open'?'closed':'open'}),
  'HOME':()=>send({action:'home'}),
  'ZHOME':()=>send({action:'zhome'}),
  'ZERO':()=>send({action:'zero'}),
  'ESTOP':()=>send({action:'estop'},true),
  'STEP':()=>{const o=[1,5,15]; setStep(o[(o.indexOf(S.step)+1)%3]);},
};

/* ===================== 터치 : 탭 + 꾹 누르기 ===================== */
let held=null, holdTimer=null, holdIv=null;

function stopHold(){
  held=null;
  clearTimeout(holdTimer); clearInterval(holdIv);
  holdTimer=holdIv=null;
  el.hint.textContent='꾹 누르면 연속 이동';
  document.querySelectorAll('.k.lit').forEach(b=>b.classList.remove('lit'));
}

function startHold(act, btn){
  holdTimer = setTimeout(()=>{
    held = act;
    btn.classList.add('lit');
    el.hint.textContent='연속 이동 중 — 떼면 정지';
    // ack 가 돌아와 canSend() 가 참이 될 때만 다음 스텝을 낸다 → 자동 스로틀
    holdIv = setInterval(()=>{ if(held && canSend()){ buzz(8); ACT[held](); } }, HOLD_TICK);
  }, HOLD_DELAY);
}

document.querySelectorAll('.k[data-act]').forEach(btn=>{
  const act = btn.dataset.act;
  btn.addEventListener('pointerdown', e=>{
    e.preventDefault();
    if(btn.getAttribute('aria-disabled')==='true' && act!=='STEP'){ buzz([10,50,10]); return; }
    try{ btn.setPointerCapture(e.pointerId); }catch(_){}
    buzz(12);
    ACT[act]();
    if(btn.dataset.hold) startHold(act, btn);
  });
  ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(ev=>
    btn.addEventListener(ev, stopHold));
});
addEventListener('blur', stopHold);
addEventListener('visibilitychange', ()=>{ if(document.hidden) stopHold(); });

$('estop').addEventListener('pointerdown', e=>{
  e.preventDefault(); stopHold(); buzz([25,40,25]); ACT.ESTOP();
});

/* 데스크톱 확인용 키보드 */
const KEYS={a:'J1+',d:'J1-',w:'J2+',s:'J2-',r:'Z+',f:'Z-',g:'GRIP',h:'HOME',z:'ZHOME',o:'ZERO'};
addEventListener('keydown',e=>{
  if(e.target.matches('input')) return;
  if(e.key==='Escape'){ ACT.ESTOP(); return; }
  if(['1','2','3'].includes(e.key)){ setStep([1,5,15][+e.key-1]); return; }
  const a=KEYS[e.key.toLowerCase()];
  if(a && !e.repeat){ e.preventDefault(); ACT[a](); }
});

/* ===================== 설정 ===================== */
function setStep(v){
  S.step=v;
  document.querySelectorAll('#segStep button').forEach(b=>
    b.setAttribute('aria-pressed', String(+b.dataset.step===v)));
  render();
}
document.querySelectorAll('#segStep button').forEach(b=>
  b.addEventListener('click',()=>{ buzz(8); setStep(+b.dataset.step); }));
$('rpm').addEventListener('input',e=>{ S.rpm=+e.target.value; el.rpmv.textContent=S.rpm; });

/* 화면 꺼짐 방지 */
(async()=>{ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(_){} })();

/* ===================== Firebase ===================== */
async function boot(){
  if(!(FB_CONFIG.databaseURL && FB_CONFIG.apiKey)){
    S.sim=true;
    Object.assign(S,{j1:0,j2:0,j1c:0,j2c:0,z:0,grip:'open',ack:0});
    log('시뮬레이터 모드','warn'); render(); return;
  }
  try{
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getDatabase, ref, onValue, set } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const db = getDatabase(initializeApp(FB_CONFIG));
    S.refCmd = ref(db, `robots/${ROBOT_ID}/cmd`);
    S.setFn  = set;
    onValue(ref(db, `robots/${ROBOT_ID}/state`), snap=>{
      const v=snap.val(); if(!v) return;
      S.ack=v.ack??S.ack; S.busy=!!v.busy;
      S.j1=v.j1_deg??null; S.j1c=v.j1_cnt; S.j2=v.j2_deg??null; S.j2c=v.j2_cnt;
      S.z=v.z_mm??null; S.grip=v.grip??null;
      S.hb=v.hb?Number(v.hb):Date.now();
      if(v.fault) log('오류 '+v.fault,'err');
      render();
    }, err=>log('구독 실패 '+err.message,'err'));
    log('Firebase 연결','ok');
  }catch(e){ log('초기화 실패 '+e.message,'err'); }
  render();
}

/* ===================== 시뮬레이터 ===================== */
function simExec(p){
  S.busy=true; render();
  const dur = p.action==='home'?2200 : p.action==='zhome'?2600 : 550;
  setTimeout(()=>{
    if(p.action==='jog'){
      const k='j'+p.axis;
      S[k]=+((S[k]||0)+p.delta).toFixed(1);
      S[k+'c']=Math.round(S[k]*CNT_PER_DEG*-1);
    }
    if(p.action==='zjog') S.z=Math.min(LIMIT.z[1],Math.max(LIMIT.z[0],(S.z||0)+p.delta));
    if(p.action==='grip') S.grip=p.value;
    if(p.action==='home'||p.action==='zero') Object.assign(S,{j1:0,j2:0,j1c:0,j2c:0});
    if(p.action==='zhome') S.z=0;
    S.busy=false; S.ack=p.seq; render();
  }, dur);
}

setInterval(render, 1000);
boot();
</script>
