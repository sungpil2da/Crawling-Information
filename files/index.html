<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기획 워크플로 · 목표에서 개선까지</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee;--card:#fff;--ink:#191b21;--ink2:#3a3f4a;--mute:#71767f;--faint:#a0a5ad;
  --rule:#dedbd4;--rule2:#eeece7;
  --ac:#5b3a94;--ac-bg:#f1ecf9;
  --at:#b8562a;--at-bg:#fbeee7;
  --ok:#2d6b4f;--ok-bg:#e8f2ec;
  --deep:#1c1a26;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.62;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--rule);
  border-radius:5px;padding:9px 11px;width:100%;background:#fff;}
textarea{resize:vertical;line-height:1.55;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent;}
input[type=range]{padding:0;border:none;accent-color:var(--ac);}

/* 헤더 */
header{background:var(--deep);color:#f0eef5;padding:11px 20px;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:60;}
.ttl{font-weight:800;font-size:15px;letter-spacing:-.02em;background:transparent;border:none;
  color:#fff;padding:4px 8px;width:auto;min-width:200px;flex:0 1 320px;}
.ttl:focus{outline:1px solid #4b4560;background:#252235;}
.cyc{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:5px 10px;border-radius:3px;
  background:#332c47;color:#c3b3e8;font-weight:700;}
.hsp{flex:1;}
.tm{display:flex;align-items:center;gap:6px;}
.tm .cl{font-family:var(--mono);font-size:19px;font-weight:700;min-width:62px;text-align:right;}
.tm .cl.hot{color:#ffb082;} .tm .cl.done{color:#ff7a5c;}
.tb{font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 8px;border-radius:3px;background:#332c47;color:#a99ec9;}
.tb:hover{background:#443a5e;color:#fff;}

/* 레이아웃 */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 52px);align-items:start;}
@media(max-width:900px){.shell{grid-template-columns:1fr;}}
nav{border-right:1px solid var(--rule);padding:16px 12px 40px;position:sticky;top:52px;}
@media(max-width:900px){nav{position:static;border-right:none;border-bottom:1px solid var(--rule);
  display:flex;gap:6px;overflow-x:auto;padding:12px;}}
.nv{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:5px;width:100%;
  text-align:left;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:2px;white-space:nowrap;}
.nv:hover{background:var(--rule2);}
.nv.on{background:var(--ac);color:#fff;}
.nv .nn{font-family:var(--mono);font-size:10px;font-weight:700;opacity:.72;flex:0 0 auto;}
.nv .dt{width:6px;height:6px;border-radius:50%;background:var(--rule);margin-left:auto;flex:0 0 auto;}
.nv .dt.f{background:var(--ok);} .nv.on .dt{background:rgba(255,255,255,.45);} .nv.on .dt.f{background:#fff;}
.nvgrp{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--faint);
  padding:14px 11px 6px;font-weight:700;}
@media(max-width:900px){.nvgrp{display:none;}}

main{padding:24px 28px 90px;max-width:940px;}
@media(max-width:600px){main{padding:18px 16px 90px;}}

.ph{margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--ink);}
.ph .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ac);font-weight:700;text-transform:uppercase;}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.032em;margin-top:5px;}
.ph .s{font-size:14px;color:var(--mute);margin-top:5px;}

.hint{background:var(--deep);color:#e8e5ef;border-radius:6px;padding:14px 17px;margin-bottom:18px;font-size:14px;line-height:1.68;}
.hint .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#c9a9ff;font-weight:700;text-transform:uppercase;display:block;margin-bottom:6px;}
.hint b{color:#e0c9ff;}

.card{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:16px;margin-bottom:12px;}
.card.at{border-left:3px solid var(--at);background:var(--at-bg);}
.card.ok{border-left:3px solid var(--ok);background:var(--ok-bg);}
.card.ac{border-left:3px solid var(--ac);background:var(--ac-bg);}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.ch h3{font-size:15px;font-weight:800;letter-spacing:-.02em;}
.bd{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.07em;padding:3px 8px;border-radius:3px;background:var(--rule2);color:var(--mute);}
.bd.g{background:var(--ok-bg);color:var(--ok);} .bd.a{background:var(--at-bg);color:var(--at);}

.fl{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:5px;}
.fd{margin-bottom:12px;} .fd:last-child{margin-bottom:0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr;}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:5px;
  font-size:13.5px;font-weight:700;background:var(--ink);color:#fff;transition:opacity .15s;}
.btn:hover{opacity:.86;} .btn:disabled{opacity:.3;cursor:not-allowed;}
.btn.ac{background:var(--ac);} .btn.ok{background:var(--ok);}
.btn.gh{background:transparent;border:1px solid var(--rule);color:var(--ink2);}
.btn.gh:hover{background:var(--rule2);opacity:1;}
.btn.sm{padding:6px 11px;font-size:12px;}
.br{display:flex;gap:8px;flex-wrap:wrap;}

.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
.row .x{color:var(--faint);font-size:17px;line-height:1;padding:8px 3px 0;flex:0 0 auto;}
.row .x:hover{color:var(--at);}
.row .no{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ac);padding:11px 0 0;flex:0 0 18px;}

/* 칩 */
.cps{display:flex;gap:5px;flex-wrap:wrap;}
.cp{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:12px;
  border:1px solid var(--rule);background:#fff;color:var(--mute);}
.cp:hover{border-color:var(--ink2);color:var(--ink2);}
.cp.on{background:var(--ac);border-color:var(--ac);color:#fff;}

/* 아이디어 */
.ids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px;margin-top:12px;}
.id{border:1px solid var(--rule);border-radius:6px;background:#fff;padding:11px 12px;position:relative;}
.id .t{font-size:14px;font-weight:600;line-height:1.5;padding-right:16px;}
.id .x{position:absolute;top:7px;right:8px;color:var(--faint);font-size:14px;line-height:1;}
.id .x:hover{color:var(--at);}
.id .f{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:6px;}

/* 평가 */
.ev{border:1px solid var(--rule);border-radius:6px;background:#fff;margin-bottom:9px;overflow:hidden;}
.ev .h{padding:11px 13px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--rule2);}
.ev .h .t{flex:1;font-size:14px;font-weight:600;line-height:1.45;}
.ev .h .sc{font-family:var(--mono);font-size:13px;font-weight:700;padding:4px 9px;border-radius:4px;
  background:var(--ac-bg);color:var(--ac);flex:0 0 auto;}
.ev .b{padding:11px 13px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:700px){.ev .b{grid-template-columns:1fr 1fr;}}
.sl .l{font-size:10.5px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:3px;}
.sl .l b{font-family:var(--mono);color:var(--ac);}

/* 2x2 */
.mx{position:relative;border:1px solid var(--rule);background:#fff;border-radius:6px;
  height:320px;margin:12px 0;}
.mx .ax{position:absolute;background:var(--rule2);}
.mx .ax.v{left:50%;top:0;bottom:0;width:1px;} .mx .ax.h{top:50%;left:0;right:0;height:1px;}
.mx .lb{position:absolute;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em;}
.mx .q{position:absolute;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.04em;}
.mx .pt{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--ac);
  transform:translate(-50%,50%);cursor:default;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.mx .pt:hover{width:15px;height:15px;z-index:5;}
.mx .pt span{position:absolute;left:14px;top:-6px;font-size:11px;font-weight:600;white-space:nowrap;
  background:rgba(255,255,255,.94);padding:2px 6px;border-radius:3px;display:none;box-shadow:0 1px 4px rgba(0,0,0,.15);}
.mx .pt:hover span{display:block;}

/* 작업 */
.tk{display:grid;grid-template-columns:1fr 96px 108px 96px 26px;gap:7px;margin-bottom:7px;align-items:center;}
@media(max-width:760px){.tk{grid-template-columns:1fr 1fr;}}
.tk select,.tk input{font-size:13px;padding:7px 9px;}
.st-todo{background:#fff;} .st-doing{background:#fff8e8;} .st-done{background:var(--ok-bg);} .st-block{background:var(--at-bg);}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr;}}
.col{background:var(--rule2);border-radius:6px;padding:10px;min-height:120px;}
.col .cn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--mute);margin-bottom:9px;display:flex;justify-content:space-between;}
.tc{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:9px 10px;margin-bottom:6px;font-size:13px;line-height:1.45;}
.tc .m{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:4px;}
.tc .mv{display:flex;gap:4px;margin-top:7px;}
.tc .mv button{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:3px 6px;border-radius:3px;
  background:var(--rule2);color:var(--mute);}
.tc .mv button:hover{background:var(--ac);color:#fff;}

.bar{height:7px;background:var(--rule2);border-radius:4px;overflow:hidden;margin:10px 0 4px;}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s;}

/* 검토 */
.rv{display:grid;grid-template-columns:1fr 120px 96px;gap:8px;align-items:center;margin-bottom:7px;}
@media(max-width:600px){.rv{grid-template-columns:1fr;}}
.tog{display:flex;gap:3px;}
.tog button{flex:1;font-family:var(--mono);font-size:11px;font-weight:700;padding:6px 0;border:1px solid var(--rule);
  border-radius:4px;background:#fff;color:var(--faint);}
.tog button.on.y{background:var(--ok);border-color:var(--ok);color:#fff;}
.tog button.on.n{background:var(--at);border-color:var(--at);color:#fff;}

.sent{background:var(--deep);color:#efedf5;border-radius:7px;padding:19px 21px;font-size:18px;
  line-height:1.72;font-weight:500;letter-spacing:-.02em;margin-top:12px;}
.sent .p{color:#7d7295;font-style:italic;} .sent b{color:#d9bfff;}

.ck{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule2);cursor:pointer;}
.ck:last-child{border-bottom:none;}
.ck .b{width:18px;height:18px;border:2px solid var(--rule);border-radius:4px;flex:0 0 auto;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;}
.ck.on .b{background:var(--ok);border-color:var(--ok);}
.ck .l{font-size:13.5px;line-height:1.5;} .ck.on .l{color:var(--mute);text-decoration:line-through;}

.tiny{font-size:11.5px;color:var(--mute);line-height:1.55;margin-top:5px;}
.hide{display:none!important;}
.out{font-family:var(--mono);font-size:11.5px;line-height:1.7;background:#131118;color:#d3cee0;
  padding:15px;border-radius:6px;white-space:pre-wrap;max-height:360px;overflow-y:auto;margin-top:11px;}
.nav2{display:flex;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);}

footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);
  padding:10px 20px;display:flex;gap:9px;align-items:center;z-index:55;flex-wrap:wrap;}
footer .s{font-family:var(--mono);font-size:11px;color:var(--mute);} footer .sp{flex:1;}
</style>
</head>
<body>

<header>
  <input class="ttl" id="pTitle" value="새 프로젝트" placeholder="프로젝트 이름">
  <span class="cyc" id="cyc">CYCLE 1</span>
  <span class="hsp"></span>
  <div class="tm">
    <button class="tb" data-min="5">5분</button>
    <button class="tb" data-min="10">10분</button>
    <button class="tb" data-min="15">15분</button>
    <button class="tb" data-min="25">25분</button>
    <button class="tb" id="tStop">정지</button>
    <span class="cl" id="clock">--:--</span>
  </div>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<footer>
  <span class="s" id="stat">—</span><span class="sp"></span>
  <button class="btn gh sm" id="bLoad">불러오기</button>
  <button class="btn gh sm" id="bSave">저장</button>
  <button class="btn ac sm" id="bExport">문서로 뽑기</button>
  <input type="file" id="fIn" accept=".json" class="hide">
</footer>

<script>
"use strict";

const STAGES=[
  {n:'01',t:'목표 설정',   g:'정의',   s:'무엇을 해결하거나 달성할지 정의한다',
   h:'목표가 <b>"~를 개선한다"</b>로 끝나면 측정할 수 없습니다. 끝났는지 아닌지를 판별할 문장이어야 해요.<br>그리고 <b>안 할 것</b>을 먼저 적으세요. 범위는 적는 순간부터 새어 나갑니다.'},
  {n:'02',t:'조사 · 자료 수집',g:'정의',s:'관련 정보, 사례, 데이터, 경쟁 사례, 사용자 요구를 모은다',
   h:'자료부터 모으면 <b>읽기만 하다 끝납니다.</b> 먼저 <b>알아내야 할 질문</b>을 적고, 자료로 그 질문에 답을 채우세요.<br>답이 안 채워진 질문이 남아 있으면 조사가 안 끝난 겁니다.'},
  {n:'03',t:'문제 분석',   g:'정의',   s:'수집한 자료를 바탕으로 핵심 문제와 원인을 파악한다',
   h:'증상과 원인을 구분하세요. <b>"왜?"를 다섯 번</b> 물으면 대체로 표면에서 구조로 내려갑니다.<br>여기서 나온 근본 원인이 다음 단계 발산의 출발점이 됩니다.'},
  {n:'04',t:'브레인스토밍', g:'발산',   s:'가능한 아이디어와 해결책을 최대한 다양하게 낸다',
   h:'<b>이 단계에서 비판 금지.</b> 평가는 다음 단계에서 합니다. 지금은 개수가 목표입니다.<br>막히면 아래 발상 프롬프트를 쓰세요. 백지보다 빈칸 채우기가 훨씬 잘 나옵니다.'},
  {n:'05',t:'아이디어 평가',g:'수렴',   s:'실현 가능성, 효과, 비용, 시급성으로 비교한다',
   h:'네 축에 점수를 주면 가중 합계가 자동으로 계산됩니다. 가중치는 프로젝트마다 다르니 <b>먼저 가중치를 정하세요.</b><br>아래 2×2 지도에서 <b>우측 상단</b>이 먼저 손대야 할 영역입니다.'},
  {n:'06',t:'방향 선정',   g:'수렴',   s:'최종적으로 실행할 아이디어나 전략을 결정한다',
   h:'점수 1위를 그냥 고르지 마세요. 점수는 참고고 <b>선택 근거를 문장으로 쓰는 것</b>이 결정입니다.<br><b>버린 것과 그 이유를 기록</b>하세요. 나중에 "왜 그건 안 했냐"는 질문에 대한 답이 됩니다.'},
  {n:'07',t:'계획 수립',   g:'실행',   s:'일정, 역할, 필요한 자원, 세부 작업을 정의한다',
   h:'작업을 <b>반나절 단위</b>로 쪼개세요. 하루가 넘는 작업은 진행 상황이 안 보입니다.<br>담당자가 비어 있는 작업은 아무도 하지 않습니다. 예외 없습니다.'},
  {n:'08',t:'실행',        g:'실행',   s:'계획에 따라 실제 작업을 진행한다',
   h:'<b>막힘</b> 칸을 적극적으로 쓰세요. 막힌 걸 진행 중으로 두면 아무도 도와줄 수 없습니다.<br>막힌 작업이 이틀 이상 머물면 그건 계획이 틀린 겁니다. 7단계로 돌아가세요.'},
  {n:'09',t:'검토 · 피드백',g:'회고',  s:'결과를 확인하고 문제점이나 개선점을 수집한다',
   h:'1단계에 적은 성공 기준이 여기 그대로 올라옵니다. <b>기준을 나중에 고치지 마세요.</b><br>못 달성한 항목이 있는 게 실패가 아니라, 왜 못 했는지 모르는 게 실패입니다.'},
  {n:'10',t:'수정 · 개선', g:'회고',   s:'피드백을 반영해 계획이나 결과물을 보완한다',
   h:'개선 항목마다 <b>어느 단계로 되돌아갈지</b>를 정하세요. 그게 없으면 회고가 감상으로 끝납니다.<br>다 정했으면 아래에서 다음 사이클을 시작합니다.'},
];
const PROMPTS=['정반대로 뒤집으면?','사람 대신 기계가 하면?','10배 크게 하면?','10분의 1로 줄이면?',
  '다른 업계는 어떻게 하나?','아무 제약이 없다면?','제일 게으른 방법은?','돈을 안 쓰면?',
  '순서를 바꾸면?','합치면? 쪼개면?','없애버리면?','사용자가 직접 하게 하면?'];
const AXES=[['feas','실현 가능성'],['impact','효과'],['cost','비용 효율'],['urg','시급성']];

/* ---------- 타이머 ---------- */
function tick(){
  const c=$('clock');
  if(!S.timer.end){c.textContent='--:--';c.className='cl';return;}
  const r=Math.round((S.timer.end-Date.now())/1000);
  if(r<=0){c.textContent='00:00';c.className='cl done';}
  else{c.textContent=`${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;
       c.className='cl'+(r<=60?' hot':'');}
}
setInterval(tick,500);
document.querySelectorAll('.tb[data-min]').forEach(b=>b.onclick=()=>{S.timer.end=Date.now()+ +b.dataset.min*60000;});
$('tStop').onclick=()=>{S.timer.end=0;};

/* ---------- 완료 판정 ---------- */
const score=id=>{const s=S.sc[id];if(!s)return 0;
  return AXES.reduce((a,[k])=>a+(s[k]||0)*S.w[k],0);};
const maxScore=()=>AXES.reduce((a,[k])=>a+5*S.w[k],0)||1;
const filled=[
  ()=>!!S.goal.stm.trim()&&S.goal.crit.some(c=>c.t.trim()),
  ()=>S.research.qs.some(q=>q.t.trim())&&S.research.src.length>0,
  ()=>S.analysis.probs.some(p=>p.t.trim()&&p.root.trim()),
  ()=>S.ideas.length>=5,
  ()=>Object.keys(S.sc).length>=Math.min(3,S.ideas.length)&&S.ideas.length>0,
  ()=>S.dec.pick.length>0&&!!S.dec.why.trim(),
  ()=>S.plan.tasks.length>0&&S.plan.tasks.every(t=>t.own.trim()),
  ()=>S.plan.tasks.length>0&&S.plan.tasks.some(t=>t.st==='done'),
  ()=>Object.keys(S.rev.res).length>0||!!S.rev.kpt.k.trim(),
  ()=>S.imp.items.length>0,
];

/* ---------- 렌더 ---------- */
function render(){
  $('pTitle').value=S.title;$('cyc').textContent='CYCLE '+S.cycle;
  let last='';
  $('nav').innerHTML=STAGES.map((s,i)=>{
    const grp=(s.g!==last)?`<div class="nvgrp">${s.g}</div>`:'';last=s.g;
    return grp+`<button class="nv ${i===S.stage?'on':''}" data-s="${i}">
      <span class="nn">${s.n}</span>${s.t}<span class="dt ${filled[i]()?'f':''}"></span></button>`;
  }).join('');
  document.querySelectorAll('.nv').forEach(b=>b.onclick=()=>{S.stage=+b.dataset.s;render();window.scrollTo(0,0);});
  const st=STAGES[S.stage];
  $('main').innerHTML=`<div class="ph"><span class="k">Stage ${st.n} · ${st.g}</span><h1>${st.t}</h1>
    <div class="s">${st.s}</div></div>
    <div class="hint"><span class="k">짚어둘 것</span>${st.h}</div>
    ${[V1,V2,V3,V4,V5,V6,V7,V8,V9,V10][S.stage]()}
    <div class="nav2">
      ${S.stage>0?'<button class="btn gh" id="prev">← 이전 단계</button>':''}
      ${S.stage<9?'<button class="btn ac" id="next">다음 단계 →</button>':''}
    </div>`;
  const p=$('prev'),n=$('next');
  if(p)p.onclick=()=>{S.stage--;render();window.scrollTo(0,0);};
  if(n)n.onclick=()=>{S.stage++;render();window.scrollTo(0,0);};
  bind();
  $('stat').textContent=`아이디어 ${S.ideas.length} · 평가 ${Object.keys(S.sc).length} · 작업 ${S.plan.tasks.length}`
    +` · 완료 ${S.plan.tasks.filter(t=>t.st==='done').length} · 단계 ${filled.filter(f=>f()).length}/10`;
}

<div class="board">${STATUS.map(([v,l])=>`
  <div class="col"><div class="cn"><span>${l}</span><span>${T.filter(t=>t.st===v).length}</span></div>
    ${T.map((t,i)=>t.st!==v?'':`<div class="tc">${esc(t.n)||'(제목 없음)'}
      <div class="m">${esc(t.own)||'담당 미정'}${t.due?` · ${esc(t.due)}`:''}</div>
      <div class="mv">${STATUS.filter(([v2])=>v2!==v).map(([v2,l2])=>
        `<button data-mv="${i}|${v2}">${l2}</button>`).join('')}</div></div>`).join('')}
  </div>`).join('')}</div>`;
}

/* ===== 09 검토 ===== */
function V9(){
  const C=S.goal.crit.filter(c=>c.t.trim());
  return `
<div class="card"><div class="ch"><h3>성공 기준 대조</h3><span class="bd">1단계에서 자동으로 올라옵니다</span></div>
  ${C.length?`<div class="rv" style="font-family:var(--mono);font-size:10px;color:var(--mute);font-weight:700">
    <span>기준 · 목표</span><span>실제 결과</span><span>달성</span></div>
  ${C.map((c,i)=>{const r=S.rev.res[i]||{a:'',m:''};
    return `<div class="rv">
      <input value="${esc(c.t)}${c.tg?` → ${esc(c.tg)}`:''}" readonly style="background:#faf8f4;color:var(--ink2)">
      <input data-rv="${i}.a" value="${esc(r.a)}" placeholder="실제">
      <div class="tog"><button class="y ${r.m==='y'?'on':''}" data-rvm="${i}|y">달성</button>
        <button class="n ${r.m==='n'?'on':''}" data-rvm="${i}|n">미달</button></div></div>`;}).join('')}`
  :'<div class="tiny">1단계에 성공 기준이 없습니다. 기준 없이는 검토가 감상이 됩니다.</div>'}</div>
<div class="g3">
  ${[['k','계속할 것','잘 작동했던 것'],['p','문제였던 것','막혔거나 낭비였던 것'],['t','다음에 시도할 것','바꿔볼 것']]
    .map(([k,l,ph])=>`<div class="card"><div class="ch"><h3>${l}</h3></div>
      <textarea data-p="rev.kpt.${k}" rows="5" placeholder="${ph}">${esc(S.rev.kpt[k])}</textarea></div>`).join('')}
</div>
<div class="card"><div class="ch"><h3>받은 피드백</h3></div>
  ${S.rev.fb.map((f,i)=>`<div class="row">
    <input data-fb="${i}.t" value="${esc(f.t)}" placeholder="피드백 내용">
    <input data-fb="${i}.from" value="${esc(f.from)}" placeholder="누구에게서" style="flex:0 0 140px">
    <button class="x" data-rmfb="${i}">×</button></div>`).join('')}
  <button class="btn gh sm" id="addFb">추가</button></div>`;
}

/* ===== 10 개선 ===== */
function V10(){return `
<div class="card"><div class="ch"><h3>개선 항목</h3><span class="bd">되돌아갈 단계를 반드시 지정</span></div>
  ${S.imp.items.length?S.imp.items.map((it,i)=>`<div class="card" style="margin-bottom:9px;padding:12px">
    <div class="row" style="margin-bottom:8px"><input data-imp="${i}.t" value="${esc(it.t)}" placeholder="무엇을 개선할 것인가">
      <button class="x" data-rmimp="${i}">×</button></div>
    <div class="g2">
      <div><label class="fl">구체적 조치</label><input data-imp="${i}.a" value="${esc(it.a)}" placeholder="어떻게 바꾼다"></div>
      <div><label class="fl">되돌아갈 단계</label>
        <select data-imp="${i}.g">${STAGES.map((s,j)=>`<option value="${j}" ${String(it.g)===String(j)?'selected':''}>${s.n} ${s.t}</option>`).join('')}</select></div>
    </div></div>`).join(''):'<div class="tiny">아직 없습니다.</div>'}
  <button class="btn gh sm" id="addImp">항목 추가</button></div>
<div class="card ok"><div class="ch"><h3>다음 사이클</h3><span class="bd g">CYCLE ${S.cycle} → ${S.cycle+1}</span></div>
  <div style="font-size:13.5px;line-height:1.65">사이클을 넘기면 <b>목표·조사·분석·아이디어·평가·선정은 그대로 남고</b>,
  실행 상태와 검토 내용만 비워집니다. 개선 항목은 다음 사이클의 출발점으로 이어집니다.</div>
  <div class="br" style="margin-top:12px">
    <button class="btn ok" id="nextCycle">다음 사이클 시작</button>
    <button class="btn gh" id="resetAll">전부 초기화</button></div></div>`;}

/* ---------- 바인딩 ---------- */
function setPath(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;}
function bind(){
  document.querySelectorAll('[data-p]').forEach(e=>e.oninput=ev=>{setPath(e.dataset.p,ev.target.value);
    if(e.dataset.p.startsWith('dec.stm'))render();});

  // 01
  document.querySelectorAll('[data-crit]').forEach(e=>e.oninput=ev=>{
    const [i,f]=e.dataset.crit.split('.');S.goal.crit[+i][f]=ev.target.value;});
  const ac=$('addCrit');if(ac)ac.onclick=()=>{S.goal.crit.push({t:'',tg:''});render();};
  document.querySelectorAll('[data-rmcrit]').forEach(b=>b.onclick=()=>{
    S.goal.crit.splice(+b.dataset.rmcrit,1);if(!S.goal.crit.length)S.goal.crit=[{t:'',tg:''}];render();});

  // 02
  document.querySelectorAll('[data-q]').forEach(e=>e.oninput=ev=>{S.research.qs[+e.dataset.q].t=ev.target.value;});
  document.querySelectorAll('[data-qd]').forEach(l=>l.onclick=()=>{
    const q=S.research.qs[+l.dataset.qd];q.done=!q.done;render();});
  document.querySelectorAll('[data-rmq]').forEach(b=>b.onclick=()=>{
    S.research.qs.splice(+b.dataset.rmq,1);if(!S.research.qs.length)S.research.qs=[{t:'',done:false}];render();});
  const aq=$('addQ');if(aq)aq.onclick=()=>{S.research.qs.push({t:'',done:false});render();};
  document.querySelectorAll('[data-src]').forEach(e=>{const h=ev=>{
    const [i,f]=e.dataset.src.split('.');S.research.src[+i][f]=ev.target.value;};
    e.oninput=h;e.onchange=h;});
  document.querySelectorAll('[data-rmsrc]').forEach(b=>b.onclick=()=>{S.research.src.splice(+b.dataset.rmsrc,1);render();});
  const as=$('addSrc');if(as)as.onclick=()=>{S.research.src.push({t:'',k:'사례',u:'',s:''});render();};

  // 03
  document.querySelectorAll('[data-prob]').forEach(e=>e.oninput=ev=>{
    const [i,f]=e.dataset.prob.split('.');S.analysis.probs[+i][f]=ev.target.value;});
  document.querySelectorAll('[data-why]').forEach(e=>e.oninput=ev=>{
    const [i,j]=e.dataset.why.split('.');S.analysis.probs[+i].whys[+j]=ev.target.value;});
  document.querySelectorAll('[data-pri]').forEach(e=>e.onchange=ev=>{S.analysis.probs[+e.dataset.pri].pri=ev.target.value;});
  document.querySelectorAll('[data-rmprob]').forEach(b=>b.onclick=()=>{S.analysis.probs.splice(+b.dataset.rmprob,1);render();});
  const ap=$('addProb');if(ap)ap.onclick=()=>{S.analysis.probs.push({t:'',whys:['','','','',''],root:'',pri:'중'});render();};

  // 04
  const dt=$('dTx');
  if(dt){dt.oninput=e=>{S.draft=e.target.value;};
    dt.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')addIdea();};}
  const ai=$('addIdea');if(ai)ai.onclick=addIdea;
  document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{
    const t=$('dTx');S.draft=(S.draft?S.draft+' ':'')+`[${b.dataset.pr}] `;t.value=S.draft;t.focus();});
  document.querySelectorAll('[data-rmid]').forEach(b=>b.onclick=()=>{
    S.ideas=S.ideas.filter(x=>x.id!=b.dataset.rmid);delete S.sc[b.dataset.rmid];
    S.dec.pick=S.dec.pick.filter(i=>i!=b.dataset.rmid);render();});

  // 05
  document.querySelectorAll('[data-w]').forEach(e=>e.oninput=ev=>{S.w[e.dataset.w]=+ev.target.value;render();});
  document.querySelectorAll('[data-sc]').forEach(e=>e.oninput=ev=>{
    const [id,k]=e.dataset.sc.split('|');S.sc[id]=S.sc[id]||{};S.sc[id][k]=+ev.target.value;render();});

  // 06
  document.querySelectorAll('[data-pk]').forEach(l=>l.onclick=()=>{
    const id=l.dataset.pk;
    S.dec.pick=S.dec.pick.includes(id)?S.dec.pick.filter(x=>x!==id):[...S.dec.pick,id];render();});
  document.querySelectorAll('[data-drop]').forEach(e=>e.oninput=ev=>{
    const id=e.dataset.drop,f=S.dec.drop.find(d=>d.id===id);
    if(f)f.r=ev.target.value;else S.dec.drop.push({id,r:ev.target.value});});

  // 07
  document.querySelectorAll('[data-tk]').forEach(e=>{const h=ev=>{
    const [i,f]=e.dataset.tk.split('.');S.plan.tasks[+i][f]=ev.target.value;
    if(f==='st')render();};e.oninput=h;e.onchange=h;});
  document.querySelectorAll('[data-rmtk]').forEach(b=>b.onclick=()=>{S.plan.tasks.splice(+b.dataset.rmtk,1);render();});
  const at=$('addTk');if(at)at.onclick=()=>{S.plan.tasks.push({n:'',own:'',due:'',st:'todo'});render();};
  document.querySelectorAll('[data-ms]').forEach(e=>e.oninput=ev=>{
    const [i,f]=e.dataset.ms.split('.');S.plan.ms[+i][f]=ev.target.value;});
  document.querySelectorAll('[data-rmms]').forEach(b=>b.onclick=()=>{
    S.plan.ms.splice(+b.dataset.rmms,1);if(!S.plan.ms.length)S.plan.ms=[{t:'',d:''}];render();});
  const am=$('addMs');if(am)am.onclick=()=>{S.plan.ms.push({t:'',d:''});render();};

  // 08
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    const [i,v]=b.dataset.mv.split('|');S.plan.tasks[+i].st=v;render();});

  // 09
  document.querySelectorAll('[data-rv]').forEach(e=>e.oninput=ev=>{
    const [i,f]=e.dataset.rv.split('.');S.rev.res[i]=S.rev.res[i]||{a:'',m:''};S.rev.res[i][f]=ev.target.value;});
  document.querySelectorAll('[data-rvm]').forEach(b=>b.onclick=()=>{
    const [i,v]=b.dataset.rvm.split('|');S.rev.res[i]=S.rev.res[i]||{a:'',m:''};
    S.rev.res[i].m=S.rev.res[i].m===v?'':v;render();});
  document.querySelectorAll('[data-fb]').forEach(e=>e.oninput=ev=>{
    const [i,f]=e.dataset.fb.split('.');S.rev.fb[+i][f]=ev.target.value;});
  document.querySelectorAll('[data-rmfb]').forEach(b=>b.onclick=()=>{
    S.rev.fb.splice(+b.dataset.rmfb,1);if(!S.rev.fb.length)S.rev.fb=[{t:'',from:''}];render();});
  const af=$('addFb');if(af)af.onclick=()=>{S.rev.fb.push({t:'',from:''});render();};

  // 10
  document.querySelectorAll('[data-imp]').forEach(e=>{const h=ev=>{
    const [i,f]=e.dataset.imp.split('.');S.imp.items[+i][f]=ev.target.value;};e.oninput=h;e.onchange=h;});
  document.querySelectorAll('[data-rmimp]').forEach(b=>b.onclick=()=>{S.imp.items.splice(+b.dataset.rmimp,1);render();});
  const aim=$('addImp');if(aim)aim.onclick=()=>{S.imp.items.push({t:'',a:'',g:'7'});render();};
  const nc=$('nextCycle');if(nc)nc.onclick=()=>{
    if(!confirm(`CYCLE ${S.cycle+1}을 시작합니다.\n실행 상태와 검토 내용이 초기화됩니다. 계속할까요?`))return;
    S.cycle++;S.plan.tasks.forEach(t=>t.st='todo');
    S.rev={res:{},kpt:{k:'',p:'',t:''},fb:[{t:'',from:''}]};
    const back=S.imp.items.length?Math.min(...S.imp.items.map(i=>+i.g||6)):6;
    S.stage=back;render();window.scrollTo(0,0);};
  const ra=$('resetAll');if(ra)ra.onclick=()=>{
    if(confirm('모든 내용을 지웁니다. 계속할까요?')){S=D();uid=1;render();}};
}
function addIdea(){
  const t=S.draft.trim();if(!t)return;
  S.ideas.push({id:String(uid++),t,f:''});S.draft='';render();
  const d=$('dTx');if(d)d.focus();
}
$('pTitle').oninput=e=>{S.title=e.target.value;};

/* ---------- 저장 / 문서 ---------- */
function dl(n,t,ty){const b=new Blob([t],{type:ty||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('bSave').onclick=()=>dl((S.title||'plan').replace(/[^\w가-힣-]/g,'_')+'.json',JSON.stringify({...S,uid},null,1),'application/json');
$('bLoad').onclick=()=>$('fIn').click();
$('fIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());S=Object.assign(D(),j);uid=j.uid||S.ideas.length+1;render();}
  catch(err){alert('불러오기 실패: '+err.message);}e.target.value='';};
$('bExport').onclick=()=>{
  const C=S.goal.crit.filter(c=>c.t.trim());
  const md=`# ${S.title} · CYCLE ${S.cycle}

## 1. 목표
${S.goal.stm||'(미작성)'}

### 성공 기준
${C.length?C.map((c,i)=>{const r=S.rev.res[i]||{};
  return `- ${c.t}${c.tg?` → 목표 ${c.tg}`:''}${r.a?` / 실제 ${r.a}`:''}${r.m?` [${r.m==='y'?'달성':'미달'}]`:''}`;}).join('\n'):'- (없음)'}

### 제약
${S.goal.cons||'(없음)'}

### 범위 밖
${S.goal.out||'(없음)'}

## 2. 조사
### 알아내야 할 질문
${S.research.qs.filter(q=>q.t.trim()).map(q=>`- [${q.done?'x':' '}] ${q.t}`).join('\n')||'- (없음)'}

### 자료
${S.research.src.map(s=>`- (${s.k}) ${s.t}${s.u?` — ${s.u}`:''}${s.s?`\n  ${s.s}`:''}`).join('\n')||'- (없음)'}

## 3. 문제 분석
${S.analysis.probs.filter(p=>p.t.trim()).map(p=>
`### ${p.t} [우선도 ${p.pri}]
${p.whys.filter(w=>w.trim()).map((w,i)=>`${i+1}. 왜? ${w}`).join('\n')||'(미작성)'}
**근본 원인:** ${p.root||'(미작성)'}`).join('\n\n')||'(없음)'}

## 4~5. 아이디어와 평가
가중치 — ${AXES.map(([k,l])=>`${l} ×${S.w[k]}`).join(' / ')}

${[...S.ideas].sort((a,b)=>score(b.id)-score(a.id)).map(x=>{const s=S.sc[x.id]||{};
  return `- **${x.t}** · ${score(x.id)}/${maxScore()} (${AXES.map(([k,l])=>`${l} ${s[k]||0}`).join(', ')})`;}).join('\n')||'- (없음)'}

## 6. 방향
${S.dec.stm.what?`**${S.dec.stm.what}**한다. ${S.dec.stm.why}.
첫 작업은 ${S.dec.stm.first}이다.`:'(미확정)'}

### 선택
${S.dec.pick.map(id=>{const x=S.ideas.find(i=>i.id===id);return x?`- ${x.t}`:'';}).filter(Boolean).join('\n')||'- (없음)'}

### 근거
${S.dec.why||'(미작성)'}

### 버린 것
${S.dec.drop.filter(d=>d.r.trim()).map(d=>{const x=S.ideas.find(i=>i.id===d.id);
  return x?`- ${x.t} — ${d.r}`:'';}).filter(Boolean).join('\n')||'- (없음)'}

## 7~8. 계획과 실행
${S.plan.tasks.map(t=>`- [${t.st==='done'?'x':' '}] ${t.n||'(제목 없음)'} · ${t.own||'담당 미정'}${t.due?` · ${t.due}`:''}${t.st==='block'?' **[막힘]**':''}`).join('\n')||'- (없음)'}

진행 ${S.plan.tasks.filter(t=>t.st==='done').length}/${S.plan.tasks.length}

### 자원
${S.plan.res||'(없음)'}

### 마일스톤
${S.plan.ms.filter(m=>m.t.trim()).map(m=>`- ${m.t}${m.d?` · ${m.d}`:''}`).join('\n')||'- (없음)'}

## 9. 검토
- **계속할 것:** ${S.rev.kpt.k||'(미작성)'}
- **문제였던 것:** ${S.rev.kpt.p||'(미작성)'}
- **다음에 시도할 것:** ${S.rev.kpt.t||'(미작성)'}

### 피드백
${S.rev.fb.filter(f=>f.t.trim()).map(f=>`- ${f.t}${f.from?` (${f.from})`:''}`).join('\n')||'- (없음)'}

## 10. 개선
${S.imp.items.filter(i=>i.t.trim()).map(i=>`- ${i.t} → ${i.a||'(조치 미정)'} [${STAGES[+i.g||6].n} ${STAGES[+i.g||6].t}로]`).join('\n')||'- (없음)'}
`;
  const old=$('mdOut');if(old)old.remove();
  const d=document.createElement('div');d.id='mdOut';d.className='card';
  d.innerHTML=`<div class="ch"><h3>문서</h3><span class="bd">복사해서 쓰세요</span></div>
    <div class="br"><button class="btn sm" id="cp">복사</button>
    <button class="btn gh sm" id="dlmd">.md 저장</button></div><div class="out">${esc(md)}</div>`;
  $('main').appendChild(d);d.scrollIntoView({behavior:'smooth'});
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(md);$('cp').textContent='복사됨';}
    catch(e){$('cp').textContent='직접 선택하세요';}};
  $('dlmd').onclick=()=>dl((S.title||'plan')+'.md',md,'text/markdown;charset=utf-8');
};
window.onbeforeunload=()=>(S.ideas.length||S.goal.stm)?'저장하지 않은 내용이 사라집니다.':null;

render();tick();
</script>
</body>
</html>
